 <!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML CSS Project</title>
  </head>
  <body>
    <section class="signup">
    <h2> Patient Registration</h2>
    <form id="signupForm">
        <label>Full Name</label>
        <input type="text" id="fullname" placeholder="enter ur fullname">
        <label>Email</label>
        <input type="email" id="Email" placeholder="enter ur email">
        <label>Password</label>
        <input type="password" id="password" placeholder="enter ur password">
        <label>confirmPassword</label>
        <input type="password" id="confirmPassword" placeholder="enter ur confirmPassword">
        <label>Contact Number</label>
        <input type="text" id="contact" placeholder="contact number">
        <button type="submit">Signup</button>
        <p id="message"></p>

    </form>
  </section>
  <script src="cms.js"></script>
  </body>
</html>
